<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="@/assets/APOLLO.png" />
<link href="/src/styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Han+Sans:wght@400;700&display=swap" rel="stylesheet">
    
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阿波罗管理看板</title>
</head>

<body>
  <div id="app"></div>
  <script src="/module/PlayerControl.js"></script>
  
  <!-- ECharts错误处理脚本 -->
  <script>
    // 全局错误处理 - 解决ECharts重复注册错误
    window.addEventListener('error', function(event) {
      if (event.error && event.error.message && 
          (event.error.message.includes('axisPointer') || 
           event.error.message.includes('exists'))) {
        console.warn('ECharts重复注册错误已忽略:', event.error.message);
        event.preventDefault();
        return false;
      }
    });
    
    window.addEventListener('unhandledrejection', function(event) {
      if (event.reason && event.reason.message && 
          (event.reason.message.includes('axisPointer') || 
           event.reason.message.includes('exists'))) {
        console.warn('ECharts Promise错误已忽略:', event.reason.message);
        event.preventDefault();
        return false;
      }
    });
  </script>
  
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
